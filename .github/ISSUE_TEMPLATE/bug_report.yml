name: Bug report
description: Something analyzed wrong, crashed, or produced an invalid audit
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks. A bug report that includes the **exact tool arguments** and the
        **relevant audit slice** is usually fixable in one round trip.
        Security problems belong in a private advisory, not here — see SECURITY.md.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The observed result, in one or two sentences.
      placeholder: "The resumed job finished as completed_with_errors even though all 3 chunks were analyzed."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The `analyze_video` / `video_analysis_job` arguments, including `stitch`, `detail`, `audit_dir` and `transcribe`.
      render: jsonc
      placeholder: |
        analyze_video({
          video_path: "clip.mp4",
          prompt: "Cut sheet with timestamps",
          stitch: "model",
          detail: "full",
          transcribe: { engine: "transcriptions", granularity: "word" }
        })
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Audit evidence
      description: Paste the relevant fields only — `parsing`, `chain[i].api`, `chain[i].transcription`, `segments[i].transcript`, or `audit.resume`. Redact keys and private paths.
      render: json
    validations:
      required: false

  - type: input
    id: versions
    attributes:
      label: Versions
      description: Plugin version, schema version, OpenCode version, OS, Node/Bun version.
      placeholder: "plugin 2.6.1, schema 1.5, OpenCode 0.x, Windows 11, Node 24"
    validations:
      required: true

  - type: textarea
    id: media
    attributes:
      label: Media
      description: Duration, resolution, container, and whether the file has an audio stream. Never attach private footage.
      placeholder: "150 s, 1080x1920, mp4/h264, audio: aac 48 kHz stereo"
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I am on the latest `main`, not an older copy in another project.
          required: true
        - label: I removed API keys, tokens and personal data from everything pasted above.
          required: true
        - label: This is not a security issue (those go through the private advisory link).
          required: true
