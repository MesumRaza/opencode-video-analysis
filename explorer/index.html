<!doctype html>
<html lang="en" data-theme="dark" data-contrast="normal">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Video analysis</title>
<style>
  :root {
    --bg: #0e1013; --panel: #15181d; --panel-2: #1a1e24;
    --line: #262b33; --line-soft: #1e232a;
    --text: #d7dce3; --dim: #9aa3ae; --muted: #77808c;
    --accent: #6ea8fe; --active-bg: #221f19; --active-line: #c8b58a;
    --defect: #e5484d; --warn: #d4a72c; --ok: #57ab5a;
    --r: 4px; --video-w: clamp(280px, 30vw, 520px);
  }
  :root[data-theme="light"] {
    --bg: #fbfbfc; --panel: #fff; --panel-2: #f5f6f8;
    --line: #dfe2e7; --line-soft: #eceef1;
    --text: #1b1f24; --dim: #4d545d; --muted: #6a727c;
    --accent: #2563eb; --active-bg: #f3efe4; --active-line: #a8874a;
    --defect: #c62b31; --warn: #8a6d1f; --ok: #2b7a3d;
  }
  :root[data-contrast="high"] {
    --bg: #000; --panel: #000; --panel-2: #0c0c0c; --line: #fff; --line-soft: #6b6b6b;
    --text: #fff; --dim: #f0f0f0; --muted: #d0d0d0;
    --accent: #8fc2ff; --active-bg: #1e1c15; --active-line: #ffe082;
    --defect: #ff5a5f; --warn: #ffd166; --ok: #7ee787;
  }
  :root[data-theme="light"][data-contrast="high"] {
    --bg: #fff; --panel: #fff; --panel-2: #f2f2f2; --line: #000; --line-soft: #666;
    --text: #000; --dim: #111; --muted: #333;
    --accent: #003f9e; --active-bg: #fff3cd; --active-line: #6b4e00;
    --defect: #a4000a; --warn: #6b4e00; --ok: #14532d;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px/1.45 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; overflow: hidden;
  }
  /* quiet scrollbars instead of bright OS strips */
  * { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  *::-webkit-scrollbar { width: 10px; height: 8px; }
  *::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-corner { background: transparent; }
  .mono, .tc, code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }

  /* header */
  header {
    display: flex; align-items: center; gap: 8px; min-height: 42px; padding: 6px 12px;
    border-bottom: 1px solid var(--line); background: var(--panel);
    flex: 0 0 auto; flex-wrap: wrap; overflow: hidden;
  }
  .title { display: flex; flex-direction: column; min-width: 0; max-width: 26%; }
  .title b { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 26vw; }
  .title span { font-size: 10.5px; color: var(--muted); }
  .grow { flex: 1 1 auto; }
  .hbtn { background: transparent; border: 1px solid transparent; color: var(--dim); border-radius: var(--r); padding: 4px 8px; font-size: 12px; cursor: pointer; }
  .hbtn:hover { background: var(--panel-2); color: var(--text); }
  .hbtn.on { background: var(--panel-2); border-color: var(--line); color: var(--text); }
  input[type="search"] { width: clamp(120px, 17vw, 190px); background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: var(--r); padding: 4px 8px; font-size: 12px; }
  input[type="search"]:focus { outline: 1px solid var(--accent); outline-offset: -1px; }
  menu.pop { position: absolute; right: 10px; top: 38px; z-index: 40; min-width: 280px; background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 6px; box-shadow: 0 10px 24px #0006; }
  menu.pop[hidden] { display: none; }
  menu.pop button { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--text); padding: 6px 8px; border-radius: 3px; font-size: 12px; cursor: pointer; }
  menu.pop button:hover { background: var(--panel-2); }
  .poprow { display: flex; align-items: center; gap: 6px; padding: 5px 8px; }
  .poprow > span { font-size: 11px; color: var(--muted); flex: 0 0 64px; }
  .poprow input[type="file"] {
    flex: 1 1 auto; min-width: 0; font-size: 11px; color: var(--dim);
  }
  .poprow input[type="file"]::file-selector-button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: var(--r); padding: 3px 8px; font-size: 11px; margin-right: 6px; cursor: pointer;
  }
  .poprow input[type="text"] {
    flex: 1 1 auto; min-width: 0; background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: var(--r); padding: 4px 6px; font-size: 11.5px;
  }
  .poprow button { width: auto; flex: 0 0 auto; border: 1px solid var(--line); background: var(--panel-2); }
  .popsep { height: 1px; background: var(--line); margin: 5px 4px; }

  .banner { display: none; padding: 5px 12px; font-size: 11.5px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--warn) 12%, var(--panel)); }
  .banner.on { display: block; }

  /* layout: video left, everything else right */
  .body { display: flex; align-items: stretch; gap: 0; flex: 1 1 auto; min-height: 0; }
  .videocol {
    flex: 0 0 var(--video-w); width: var(--video-w); height: 100%;
    border-right: 1px solid var(--line); background: var(--panel);
    display: flex; flex-direction: column; overflow: auto;
  }
  .videocol.hidden { display: none; }
  .videocol video { width: 100%; max-height: 62vh; background: #000; display: block; }
  .videofoot { padding: 8px 10px 10px; background: var(--panel); border-top: 1px solid var(--line); font-size: 11.5px; color: var(--dim); }
  .videofoot .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
  .scrub { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .scrub input[type="range"] {
    -webkit-appearance: none; appearance: none; flex: 1 1 auto; height: 16px;
    background: transparent; cursor: pointer; margin: 0;
  }
  .scrub input[type="range"]::-webkit-slider-runnable-track {
    height: 4px; border-radius: 2px; background: var(--panel-2); border: 1px solid var(--line);
  }
  .scrub input[type="range"]::-moz-range-track {
    height: 4px; border-radius: 2px; background: var(--panel-2); border: 1px solid var(--line);
  }
  .scrub input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 11px; height: 11px; margin-top: -5px; border-radius: 50%;
    background: var(--accent); border: 1px solid var(--panel);
  }
  .scrub input[type="range"]::-moz-range-thumb {
    width: 11px; height: 11px; border-radius: 50%; background: var(--accent); border: 1px solid var(--panel);
  }
  .vbtn { min-width: 28px; min-height: 24px; }
  .vbtn:focus-visible, .hbtn:focus-visible, .tab:focus-visible, .chip:focus-visible,
  .scrub input:focus-visible, select:focus-visible, input[type="search"]:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  .videofoot b { color: var(--text); font-weight: 500; }
  .videofoot .tc { color: var(--accent); }
  .videofoot .now { font-size: 12px; color: var(--text); margin-bottom: 2px; }
  .videofoot .sub { color: var(--muted); font-size: 11px; }
  .vbtn { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: var(--r); padding: 2px 7px; font-size: 11px; cursor: pointer; }
  select.speed { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: var(--r); font-size: 11px; padding: 2px 4px; }

  .datacol { flex: 1 1 auto; min-width: 0; height: 100%; display: flex; flex-direction: column; }

  /* timeline */
  .tl { border-bottom: 1px solid var(--line); background: var(--panel); padding: 6px 12px 5px; }
  .tlhead { display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .legend { display: inline-flex; align-items: center; gap: 4px; }
  .sw { width: 10px; height: 3px; border-radius: 2px; display: inline-block; }
  .sw.defect { background: var(--defect); } .sw.ts { background: var(--accent); } .sw.pause { background: var(--warn); }
  .tlscroll { overflow-x: auto; }
  .tlwrap { position: relative; }
  .ruler { position: relative; height: 15px; margin-left: 56px; border-bottom: 1px solid var(--line-soft); }
  .tick { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line-soft); font-size: 10px; color: var(--muted); padding-left: 3px; }
  .lane { display: flex; height: 19px; margin-top: 2px; }
  .lane .lab { flex: 0 0 56px; font-size: 10px; color: var(--muted); text-align: right; padding: 3px 6px 0 0; }
  .lane .track { position: relative; flex: 1 1 auto; background: var(--panel-2); border-radius: 3px; }
  .bar { position: absolute; top: 3px; bottom: 3px; background: #333c48; border: 1px solid #4a5563; border-radius: 2px; cursor: pointer; }
  .bar:hover { filter: brightness(1.35); }
  .bar.on { background: var(--active-bg); border-color: var(--active-line); }
  .pausebar { position: absolute; top: 7px; bottom: 7px; background: var(--warn); opacity: .5; }
  .mark { position: absolute; top: 2px; bottom: 2px; width: 2px; cursor: pointer; }
  .mark.defect { background: var(--defect); } .mark.timestamp { background: var(--accent); opacity: .7; }
  .ph { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--text); z-index: 5; pointer-events: none; }

  /* tabs */
  .tabs { display: flex; align-items: center; gap: 2px; padding: 0 8px; border-bottom: 1px solid var(--line); background: var(--panel); flex: 0 0 auto; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--dim); padding: 7px 10px; font-size: 12px; cursor: pointer; }
  .tab:hover { color: var(--text); }
  .tab.on { color: var(--text); border-bottom-color: var(--accent); }
  .tab .n { color: var(--muted); font-size: 10.5px; margin-left: 4px; }
  .tab .x { color: var(--muted); margin-left: 6px; font-size: 10px; visibility: hidden; }
  .tab:hover .x { visibility: visible; }
  .tabbar { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46%; }

  /* content */
  .content { flex: 1 1 auto; min-height: 0; overflow: auto; }
  .pad { padding: 10px 12px 40px; }
  .empty { color: var(--muted); text-align: center; padding: 44px 12px; font-size: 12px; }
  .metrics { display: flex; flex-wrap: wrap; gap: 20px; padding: 2px 0 12px; }
  .metric b { display: block; font-size: 16px; font-weight: 600; }
  .metric span { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; font-weight: 500; color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .06em; border-bottom: 1px solid var(--line); padding: 5px 6px; position: sticky; top: 0; background: var(--bg); z-index: 2; }
  td { border-bottom: 1px solid var(--line-soft); padding: 5px 6px; vertical-align: top; }
  tr.row:hover td { background: var(--panel-2); cursor: pointer; }
  tr.row.on td { background: var(--active-bg); }
  tr.row.on td:first-child { box-shadow: inset 2px 0 0 var(--active-line); }
  td.t, td.n { white-space: nowrap; font-variant-numeric: tabular-nums; }
  td.dim, .dim { color: var(--dim); }
  .tc { color: var(--accent); cursor: pointer; }
  .tc:hover { text-decoration: underline; }
  .clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tag { display: inline-block; font-size: 10px; line-height: 15px; padding: 0 5px; border: 1px solid var(--line); border-radius: 3px; color: var(--muted); margin-right: 4px; white-space: nowrap; }
  .tag.defect { color: var(--defect); border-color: color-mix(in srgb, var(--defect) 45%, transparent); }
  .tag.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  .tag.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
  .tag.ent { cursor: pointer; }
  .tag.ent.on { color: var(--accent); border-color: var(--accent); }

  .srow { border-bottom: 1px solid var(--line-soft); padding: 6px 8px; cursor: pointer; }
  .srow:hover { background: var(--panel-2); }
  .srow.on { background: var(--active-bg); box-shadow: inset 2px 0 0 var(--active-line); }
  .smeta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 2px; }
  .stext { font-size: 12.5px; }
  .w.cur { background: var(--active-line); color: #000; border-radius: 2px; }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  .toolbar select { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: var(--r); font-size: 11.5px; padding: 3px 6px; }
  .toolbar .meta { font-size: 11px; color: var(--muted); }
  .two, .three { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .content { background: var(--bg); }
  .pad { min-height: 100%; display: flex; flex-direction: column; }
  h3.sec { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 12px 0 5px; font-weight: 500; }
  .cov { position: relative; height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; margin: 4px 0 10px; }
  .cov .c { position: absolute; top: 0; bottom: 0; background: var(--ok); opacity: .5; }
  .cov .g { position: absolute; top: 0; bottom: 0; background: var(--defect); opacity: .7; }
  .cov .h { position: absolute; top: -2px; bottom: -2px; width: 1px; background: var(--text); }
  .video { display: flex; flex-direction: column; }
  .statusbar {
    flex: 0 0 26px; height: 26px; z-index: 35;
    display: flex; align-items: center; gap: 14px; padding: 0 12px;
    border-top: 1px solid var(--line); background: var(--panel);
    font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden;
  }
  .statusbar b { color: var(--text); font-weight: 500; }
  .statusbar .sep { width: 1px; height: 12px; background: var(--line); }
  .statusbar .grow { flex: 1 1 auto; }
  .statusbar .keys { color: var(--muted); overflow: hidden; text-overflow: ellipsis; }

  .toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); color: var(--text); padding: 5px 10px; border-radius: var(--r); font-size: 12px; opacity: 0; transition: opacity .15s; pointer-events: none; z-index: 60; }
  .toast.show { opacity: 1; }
  @media (max-width: 1000px) {
    #followBtn, #themeBtn, #contrastBtn { display: none; }
    .hbtn { padding: 4px 6px; font-size: 11.5px; }
  }
  @media (max-width: 820px) {
    .body { flex-direction: column; }
    .videocol { flex: 0 0 auto; width: 100%; height: auto; max-height: 46vh; }
    .datacol { height: auto; flex: 1 1 auto; }
    .content { overflow: auto; }
  }
</style>
</head>
<body>
<header>
  <div class="title"><b id="title">Video analysis</b><span id="subtitle"></span></div>
  <div class="grow"></div>
  <input type="search" id="filter" placeholder="Search /" aria-label="Search" />
  <button class="hbtn on" id="videoBtn">Video</button>
  <button class="hbtn" id="followBtn">Follow</button>
  <button class="hbtn" id="themeBtn">Light</button>
  <button class="hbtn" id="contrastBtn">Contrast</button>
  <button class="hbtn" id="moreBtn">⋯</button>
  <menu class="pop" id="pop" hidden>
    <div class="poprow"><span>Audit JSON</span><input type="file" id="auditFile" accept=".json,application/json" aria-label="Load audit JSON file" /></div>
    <div class="poprow"><span>Video</span><input type="file" id="videoFile" accept="video/*" aria-label="Load video file" /></div>
    <div class="popsep"></div>
    <div class="poprow">
      <span>Path</span>
      <input type="text" id="pathInput" placeholder="audits/my-video-abc123.audit.json" aria-label="Path to audit or video" />
      <button id="pathLoadBtn" title="Load from a path served by the local server">Load</button>
    </div>
    <button id="latestBtn">Load latest export from artifacts/</button>
    <div class="popsep"></div>
    <button id="exportBtn">Copy scenes as TSV</button>
    <button id="followMenu">Toggle follow</button>
    <button id="themeMenu">Toggle theme</button>
    <button id="contrastMenu">Toggle contrast</button>
  </menu>
</header>

<div class="banner" id="banner"></div>

<div class="body">
  <aside class="videocol" id="videocol">
    <video id="video" preload="metadata" playsinline controls></video>
    <div class="videofoot">
      <div class="scrub">
        <input id="scrub" class="seek" type="range" min="0" max="10000" step="1" value="0" aria-label="Seek position" title="Seek" />
        <span class="mono" id="now" title="current time">00:00.0</span>
        <span class="dim mono" id="dur" title="duration">--:--</span>
      </div>
      <div class="row">
        <button class="vbtn" id="playBtn" aria-label="Play or pause" title="Play / pause (space)">Play</button>
        <button class="vbtn" data-seek="-10" aria-label="Back 10 seconds" title="Back 10s (j)">−10s</button>
        <button class="vbtn" data-seek="-2" aria-label="Back 2 seconds" title="Back 2s (←)">−2s</button>
        <button class="vbtn" data-seek="2" aria-label="Forward 2 seconds" title="Forward 2s (→)">+2s</button>
        <button class="vbtn" data-seek="10" aria-label="Forward 10 seconds" title="Forward 10s (l)">+10s</button>
        <label class="dim" for="speed" style="font-size:11px">speed</label>
        <select class="speed" id="speed" aria-label="Playback speed">
          <option value="1">1×</option><option value="0.5">0.5×</option><option value="0.25">0.25×</option>
          <option value="1.5">1.5×</option><option value="2">2×</option>
        </select>
        <button class="vbtn" id="muteBtn" aria-label="Mute or unmute" title="Mute (m)">Mute</button>
      </div>
      <div class="now" id="nowScene" style="color:var(--text)"></div>
      <div class="sub" id="nowSub"></div>
    </div>
  </aside>

  <section class="datacol">
    <div class="tl">
      <div class="tlhead">
        <span id="tlMeta">timeline</span>
        <span class="legend"><i class="sw defect"></i>defect</span>
        <span class="legend"><i class="sw ts"></i>timestamp</span>
        <span class="legend"><i class="sw pause"></i>silence</span>
        <span class="grow"></span>
        <button class="hbtn" id="zoomOut">−</button><span id="zoomLabel" style="color:var(--muted)">fit</span><button class="hbtn" id="zoomIn">+</button>
      </div>
      <div class="tlscroll"><div class="tlwrap" id="timeline"></div></div>
    </div>

    <div class="tabs" id="tabs"></div>
    <div class="content" id="content"></div>
  </section>
</div>

<div class="toast" id="toast"></div>
<div class="statusbar" id="statusbar"></div>
<input type="file" id="filePicker" hidden />

<script>
const DEFAULT_AUDIT = "./fixtures/schema15-demo.json";
const DEFAULT_VIDEO = ""; // pair one with ?video=<url>, or drop an .mp4 on the page
const PREFS = "vae:prefs:v4";

const $ = (s, r = document) => r.querySelector(s);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };
const norm = (s) => String(s ?? "").toLowerCase();
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));

const state = {
  audit: null, transcript: null, findings: [], duration: 0, t: 0, pps: 0, dragging: false,
  view: "overview", filter: "", follow: true, theme: "dark", contrast: false,
  video: true, videoURL: null, txFilter: "all", entity: null,
};

function fmt(t, dp = 0) {
  if (!Number.isFinite(t)) return "--:--";
  const m = Math.floor(Math.abs(t) / 60), s = Math.abs(t) % 60;
  return `${t < 0 ? "-" : ""}${String(m).padStart(2, "0")}:${dp ? s.toFixed(dp).padStart(3 + dp, "0") : String(Math.floor(s)).padStart(2, "0")}`;
}
function parseTC(v) {
  if (typeof v === "number") return v;
  if (typeof v !== "string") return null;
  const m = v.trim().match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?(?:[.,](\d{1,3}))?$/);
  if (!m) return null;
  const base = m[3]
    ? Number(m[1]) * 3600 + Number(m[2]) * 60 + Number(m[3])
    : Number(m[1]) * 60 + Number(m[2]);
  return m[4] ? base + Number(`0.${m[4]}`) : base;
}
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(t._x); t._x = setTimeout(() => t.classList.remove("show"), 1600); }

/* prefs */
function loadPrefs() {
  try {
    const p = JSON.parse(localStorage.getItem(PREFS) || "{}");
    if (typeof p.follow === "boolean") state.follow = p.follow;
    if (p.theme === "light" || p.theme === "dark") state.theme = p.theme;
    if (typeof p.contrast === "boolean") state.contrast = p.contrast;
    if (typeof p.video === "boolean") state.video = p.video;
    if (typeof p.pps === "number") state.pps = p.pps;
    if (typeof p.view === "string") state.view = p.view;
    if (typeof p.txFilter === "string") state.txFilter = p.txFilter;
  } catch { /* first run */ }
}
function savePrefs() {
  try {
    localStorage.setItem(PREFS, JSON.stringify({
      follow: state.follow, theme: state.theme, contrast: state.contrast,
      video: state.video, pps: state.pps, view: state.view, txFilter: state.txFilter,
    }));
  } catch { /* ignore */ }
}
function applyChrome() {
  document.documentElement.dataset.theme = state.theme;
  document.documentElement.dataset.contrast = state.contrast ? "high" : "normal";
  $("#themeBtn").textContent = state.theme === "dark" ? "Light" : "Dark";
  $("#themeBtn").classList.toggle("on", state.theme === "light");
  $("#contrastBtn").classList.toggle("on", state.contrast);
  $("#followBtn").classList.toggle("on", state.follow);
  $("#videoBtn").classList.toggle("on", state.video);
  $("#videocol").classList.toggle("hidden", !state.video);
}

/* transcript model */
const countWords = (s) => String(s ?? "").trim().split(/\s+/).filter(Boolean).length;
const TERMINAL = /[.!?…]["'”’)]?$/;

function collectLines(audit) {
  const out = [];
  let cueSource = null;
  for (const seg of audit?.segments || []) {
    const t = seg.transcript;
    if (!t) continue;
    cueSource = t.cue_source ?? cueSource;

    // 1.5: cues are the only phrase container; words are [start, end, "word"]
    if (Array.isArray(t.cues) && t.cues.length) {
      for (const c of t.cues) {
        const a = Number(c.start_sec ?? c.start), b = Number(c.end_sec ?? c.end);
        if (!Number.isFinite(a) || !Number.isFinite(b) || b <= a || !c.text) continue;
        out.push({
          start: a,
          end: b,
          text: String(c.text).trim(),
          chunk: seg.chunk_index ?? null,
          speaker: c.speaker ?? null,
          words: Array.isArray(c.words)
            ? c.words.map((w) => Array.isArray(w)
                ? { word: String(w[2] ?? ""), start_sec: Number(w[0]), end_sec: Number(w[1]) }
                : { word: String(w.word ?? w.text ?? ""), start_sec: Number(w.start_sec ?? w.start), end_sec: Number(w.end_sec ?? w.end) })
              .filter((w) => w.word && Number.isFinite(w.start_sec) && Number.isFinite(w.end_sec))
            : null,
        });
      }
      continue;
    }

    // 1.4 fallback: provider lines
    if (Array.isArray(t.segments) && t.segments.length) {
      for (const l of t.segments) {
        const a = Number(l.start_sec ?? l.start), b = Number(l.end_sec ?? l.end);
        if (!Number.isFinite(a) || !Number.isFinite(b) || b <= a || !l.text) continue;
        out.push({ start: a, end: b, text: String(l.text).trim(), chunk: seg.chunk_index ?? null, speaker: l.speaker ?? null, words: Array.isArray(l.words) ? l.words : null });
      }
    }
  }
  const sorted = out.sort((x, y) => x.start - y.start);

  // Chunk windows overlap (default 5 s), so the boundary speech is transcribed
  // twice — by the ending chunk and again by the next one. Keep the earlier
  // chunk's copy when the later cue lands inside the previous window and
  // overlaps an existing cue; otherwise the words and speech time are counted twice.
  const byChunk = new Map();
  for (const u of sorted) {
    const k = u.chunk ?? "_";
    if (!byChunk.has(k)) byChunk.set(k, []);
    byChunk.get(k).push(u);
  }
  const ordered = (audit?.segments || [])
    .filter((s) => Number.isFinite(Number(s.start_sec)) && Number.isFinite(Number(s.end_sec)))
    .sort((a, b) => Number(a.start_sec) - Number(b.start_sec));
  const drop = new Set();
  for (let i = 1; i < ordered.length; i++) {
    const prev = ordered[i - 1];
    const end = Number(prev.end_sec);
    const prevUnits = byChunk.get(prev.chunk_index ?? "_") || [];
    const curUnits = byChunk.get(ordered[i].chunk_index ?? "_") || [];
    for (const u of curUnits) {
      if ((u.start + u.end) / 2 >= end) continue;
      if (prevUnits.some((x) => {
        const overlap = Math.min(x.end, u.end) - Math.max(x.start, u.start);
        return overlap > 0 && overlap >= 0.5 * Math.min(x.end - x.start, u.end - u.start);
      })) drop.add(u);
    }
  }

  const units = drop.size ? sorted.filter((u) => !drop.has(u)) : sorted;
  return { units, cueSource, deduped: drop.size };
}

/** Total time covered by a set of [start, end] spans, counting overlaps once. */
function unionDuration(spans) {
  const sorted = spans.map((s) => [s.start, s.end]).sort((a, b) => a[0] - b[0]);
  let total = 0;
  let cur = null;
  for (const [a, b] of sorted) {
    if (!cur) { cur = [a, b]; continue; }
    if (a <= cur[1] + 0.001) cur[1] = Math.max(cur[1], b);
    else { total += cur[1] - cur[0]; cur = [a, b]; }
  }
  return cur ? total + (cur[1] - cur[0]) : 0;
}

function clipSentences(lines, maxWords = 42, maxDur = 14) {
  const out = [];
  const push = (s) => {
    const prev = out[out.length - 1];
    if (!prev) { out.push(s); return; }
    const tiny = s.wc <= 2 && s.end - s.start < 1.2;
    const cont = !TERMINAL.test(prev.text) && s.start - prev.end <= 0.6;
    if ((tiny || cont) && prev.wc + s.wc <= maxWords && s.end - prev.start <= maxDur) {
      prev.text = `${prev.text} ${s.text}`.trim();
      prev.end = s.end;
      prev.wc += s.wc;
      prev.estimated = prev.estimated || s.estimated;
      if (prev.wordList && s.wordList) prev.wordList = prev.wordList.concat(s.wordList);
      else if (!prev.wordList && s.wordList && !prev.estimated) prev.wordList = s.wordList;
      return;
    }
    out.push(s);
  };
  for (const line of lines) {
    const parts = String(line.text).split(/(?<=[.!?…])\s+(?=["'“(\[]?[A-Z0-9])/).filter(Boolean);
    const total = Math.max(1, countWords(line.text));
    const span = line.end - line.start;
    const words = line.words?.length ? line.words : null;
    let cur = line.start;
    for (const part of parts) {
      const w = Math.max(1, countWords(part));
      const d = span * (w / total);
      const s = { start: cur, end: Math.min(line.end, cur + d), text: part.trim(), wc: w, chunk: line.chunk, estimated: parts.length > 1 };
      if (words && parts.length === 1) s.wordList = words;
      push(s);
      cur += d;
    }
  }
  out.forEach((s) => { s.end = Math.max(s.end, s.start + 0.2); s.dur = s.end - s.start; s.wpm = Math.round((s.wc / s.dur) * 60); });
  out.sort((a, b) => a.start - b.start);
  out.forEach((s, i) => { s.gapBefore = i === 0 ? s.start : Math.max(0, s.start - out[i - 1].end); });
  return out;
}

function buildTranscript(audit) {
  const { units: lines, cueSource, deduped } = collectLines(audit);
  const overall = audit?.overall?.transcript;
  const segs = (audit?.segments || []).filter((s) => s.transcript?.text);
  if (!lines.length) {
    const text = overall?.text ?? segs.map((s) => s.transcript.text).join("\n\n");
    return { mode: text ? "text" : "none", text, sentences: [], pauses: [], cueSource, engine: overall?.engine ?? null, model: overall?.model ?? null };
  }
  const sentences = clipSentences(lines);
  const duration = audit?.video?.duration_sec || 1;
  const speech = unionDuration(sentences);
  const words = sentences.reduce((n, s) => n + s.wc, 0);
  const pauses = [];
  if (sentences.length) {
    if (sentences[0].start > 0.8) pauses.push({ start: 0, end: sentences[0].start, dur: sentences[0].start });
    for (let i = 1; i < sentences.length; i++) {
      const g = sentences[i].start - sentences[i - 1].end;
      if (g >= 0.8) pauses.push({ start: sentences[i - 1].end, end: sentences[i].start, dur: g });
    }
    const tail = duration - sentences[sentences.length - 1].end;
    if (tail >= 0.8) pauses.push({ start: sentences[sentences.length - 1].end, end: duration, dur: tail });
  }
  return {
    mode: "timed", sentences, pauses, cueSource, cues: lines.length,
    engine: overall?.engine ?? null, model: overall?.model ?? null,
    stats: {
      sentences: sentences.length, words, cues: lines.length,
      deduped: deduped || 0,
      speech: Math.round(speech * 10) / 10,
      coverage: Math.round((speech / duration) * 1000) / 10,
      wpm: words > 0 ? Math.round((words / speech) * 60) : null,
      pauses: pauses.length, estimated: sentences.filter((s) => s.estimated).length,
    },
  };
}

/** Findings across 1.3–1.5: prefer at_sec, fall back to the display timestamp. */
function normalizeFindings(audit) {
  const raw = audit?.overall?.findings ?? audit?.findings ?? [];
  return raw.map((f, i) => ({
    id: f.id ?? `f${i + 1}`,
    at_sec: Number.isFinite(f.at_sec) ? f.at_sec : parseTC(f.timestamp),
    timestamp: f.timestamp ?? null,
    kind: f.kind ?? "other",
    source: f.source ?? "model",
    chunk_index: f.chunk_index ?? null,
    text: f.text ?? "",
  }));
}

const sceneAt = (t) => (state.audit?.scenes || []).find((s) => t >= s.start_sec && t < s.end_sec) || null;
const sentenceAt = (t) => (state.transcript?.sentences || []).find((s) => t >= s.start && t < s.end) || null;
const pauseAt = (t) => (state.transcript?.pauses || []).find((p) => t >= p.start && t < p.end) || null;

/* boot */
async function boot() {
  loadPrefs(); applyChrome(); wire(); renderTabs();
  const q = new URLSearchParams(location.search);
  try {
    const res = await fetch(q.get("audit") || DEFAULT_AUDIT, { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    applyPayload(await res.json());
  } catch (e) {
    const b = $("#banner");
    b.textContent = `Could not load audit (${e.message}). Serve this folder over HTTP, or use ⋯ → Load audit JSON…`;
    b.classList.add("on");
  }
  setVideo(q.get("video") || DEFAULT_VIDEO);
  if (!(q.get("video") || DEFAULT_VIDEO)) { const b = $("#banner").textContent; $("#banner").textContent = b; }
  if (q.get("t")) seek(Number(q.get("t")));
  const view = q.get("view");
  if (view && TABS.some((t) => t.id === view)) { state.view = view; renderTabs(); render(); }
}

function setVideo(url) {
  if (state.videoURL?.startsWith("blob:")) URL.revokeObjectURL(state.videoURL);
  state.videoURL = url;
  const v = $("#video");
  v.src = url;
  v.onloadedmetadata = () => { $("#dur").textContent = fmt(v.duration); };
}

function applyPayload(payload) {
  // A full/brief audit has schema_version at top level; only a job record nests it under .audit
  const audit = payload.audit && payload.audit.schema_version ? payload.audit : payload;
  state.audit = audit;
  state.transcript = buildTranscript(audit);
  state.findings = normalizeFindings(audit);
  state.duration = audit.video?.duration_sec || Math.max(0, ...(audit.scenes || []).map((s) => s.end_sec)) || 1;
  $("#dur").textContent = fmt(state.duration);
  state.entity = null;
  state.t = 0;

  $("#title").textContent = audit.video?.filename ?? "analysis";
  const bits = [fmt(state.duration), `schema ${audit.schema_version}`, audit.status];
  if (audit.input?.transcription?.enabled) bits.push(`audio ${audit.input.transcription.engine}`);
  if (payload.synthetic) bits.push("SYNTHETIC");
  $("#subtitle").textContent = bits.join(" · ");

  const b = $("#banner");
  if (payload.synthetic) { b.textContent = "Synthetic fixture — hand-written timings for UI testing, not real footage."; b.classList.add("on"); }
  else { b.classList.remove("on"); b.textContent = ""; }

  renderTabs();
  render();
}

/* tabs */
function renderStatusbar() {
  const a = state.audit, tr = state.transcript;
  const bar = $("#statusbar");
  if (!a) { bar.textContent = ""; return; }
  const defects = (state.findings || []).filter((f) => f.kind === "defect").length;
  const groups = [
    `<b>${a.scenes?.length ?? 0}</b> scenes`,
    `<b>${a.entities?.length ?? 0}</b> entities`,
    `<b>${(state.findings || []).length}</b> findings (<b>${defects}</b> defects)`,
    tr?.stats ? `<b>${tr.stats.sentences}</b> sentences · <b>${tr.stats.wpm}</b> wpm` : "no timed transcript",
    `<b>${a.parsing?.coverage?.coverage_percent ?? 0}%</b> covered · <b>${a.parsing?.chunks_completed ?? 0}/${a.parsing?.total_chunks ?? 0}</b> chunks`,
    `<b>${Math.round((a.audit?.elapsed_ms || 0) / 1000)}s</b> run`,
  ];
  bar.innerHTML = groups.map((g) => `<span>${g}</span>`).join('<span class="sep"></span>') +
    `<span class="grow"></span><span class="keys">space · n/p scenes · , . sentences · j l ±10s · / search</span>`;
}

const TABS = [
  { id: "overview", label: "Overview" },
  { id: "scenes", label: "Scenes", count: (a) => a?.scenes?.length },
  { id: "entities", label: "Entities", count: (a) => a?.entities?.length },
  { id: "findings", label: "Findings", count: () => (state.findings || []).length },
  { id: "transcript", label: "Transcript", count: () => state.transcript?.sentences?.length },
  { id: "diagnostics", label: "Diagnostics" },
];

function renderTabs() {
  const bar = $("#tabs");
  bar.innerHTML = "";
  TABS.forEach((t) => {
    const b = el("button", `tab${state.view === t.id ? " on" : ""}`);
    b.append(el("span", "", t.label));
    const n = t.count?.(state.audit);
    if (n) b.appendChild(el("span", "n", String(n)));
    if (t.id !== "overview") {
      const x = el("span", "x", "×");
      x.title = "Close this tab";
      x.onclick = (e) => { e.stopPropagation(); state.view = "overview"; savePrefs(); renderTabs(); render(); };
      b.appendChild(x);
    }
    b.onclick = () => { state.view = t.id; savePrefs(); renderTabs(); render(); };
    bar.appendChild(b);
  });
  const right = el("div", "tabbar");
  right.id = "tabbar";
  bar.appendChild(right);
}

/* timeline */
function renderTimeline() {
  const a = state.audit, tl = $("#timeline");
  tl.innerHTML = "";
  if (!a) return;
  const LAB = 56;
  const viewport = $(".tlscroll").clientWidth || 700;
  const pps = state.pps || clamp((viewport - LAB - 18) / Math.max(state.duration, 1), 1, 12);
  const track = Math.max(state.duration * pps, 120);
  tl.style.width = `${track + LAB}px`;
  $("#zoomLabel").textContent = state.pps ? `${pps.toFixed(1)} px/s` : "fit";
  tl.dataset.pps = String(pps);

  const ruler = el("div", "ruler");
  ruler.style.width = `${track}px`;
  const step = [1, 2, 5, 10, 15, 30, 60, 120, 300].find((s) => s * pps >= 52) ?? 600;
  for (let t = 0; t <= state.duration; t += step) {
    const k = el("div", "tick", fmt(t)); k.style.left = `${t * pps}px`; ruler.appendChild(k);
  }
  tl.appendChild(ruler);

  const lane = (label) => {
    const l = el("div", "lane");
    l.appendChild(el("span", "lab", label));
    const tr = el("div", "track");
    tr.style.width = `${track}px`;
    l.appendChild(tr);
    tl.appendChild(l);
    return tr;
  };

  const sc = lane("scenes");
  (a.scenes || []).forEach((s) => {
    const b = el("div", "bar");
    b.style.left = `${s.start_sec * pps}px`;
    b.style.width = `${Math.max((s.end_sec - s.start_sec) * pps, 3)}px`;
    b.dataset.s = s.start_sec; b.dataset.e = s.end_sec;
    b.title = `${s.time_range} · ${s.activity}`;
    b.onclick = () => seek(s.start_sec);
    sc.appendChild(b);
  });

  if (state.transcript?.mode === "timed") {
    const sp = lane("speech");
    (state.transcript.pauses || []).forEach((p) => {
      if (p.dur < 0.8) return;
      const pb = el("div", "pausebar");
      pb.style.left = `${p.start * pps}px`;
      pb.style.width = `${Math.max(p.dur * pps, 1)}px`;
      pb.title = `silence ${p.dur.toFixed(1)}s`;
      sp.appendChild(pb);
    });
    state.transcript.sentences.forEach((s) => {
      const b = el("div", "bar");
      b.style.left = `${s.start * pps}px`;
      b.style.width = `${Math.max(s.dur * pps, 3)}px`;
      b.dataset.s = s.start; b.dataset.e = s.end;
      b.title = `${fmt(s.start)} · ${s.wc}w · ${s.wpm}wpm\n${s.text}`;
      b.onclick = () => seek(s.start);
      sp.appendChild(b);
    });
  }

  const mk = lane("marks");
  (state.findings || []).forEach((f) => {
    const t = f.at_sec;
    if (t == null) return;
    const m = el("div", `mark ${f.kind === "defect" ? "defect" : "timestamp"}`);
    m.style.left = `${t * pps}px`;
    m.title = `${f.kind} ${f.timestamp} — ${f.text.slice(0, 110)}`;
    m.onclick = () => seek(t);
    mk.appendChild(m);
  });

  const ph = el("div", "ph");
  ph.id = "ph";
  ph.style.left = `${LAB + state.t * pps}px`;
  ph.style.height = `${tl.scrollHeight}px`;
  tl.appendChild(ph);
}

/* views */
function render() {
  if (!state.audit) return;
  renderTimeline();
  const tb = $("#tabbar");
  if (tb) {
    const tr = state.transcript;
    tb.textContent = tr?.stats
      ? `${tr.stats.wpm} wpm · speech ${fmt(tr.stats.speech)} (${tr.stats.coverage}%) · ${tr.stats.pauses} pauses`
      : `${state.audit.parsing?.chunks_completed}/${state.audit.parsing?.total_chunks} chunks · ${state.audit.parsing?.coverage?.coverage_percent ?? 0}% covered`;
  }
  const c = $("#content");
  c.innerHTML = "";
  const box = el("div", "pad");
  c.appendChild(box);
  ({ overview: vOverview, scenes: vScenes, entities: vEntities, findings: vFindings, transcript: vTranscript, diagnostics: vDiag })[state.view]?.(box);
  renderStatusbar();
  paint(state.t);
}

function coverageBar() {
  const cov = state.audit?.parsing?.coverage;
  if (!cov) return null;
  const w = el("div", "cov"), d = state.duration || 1;
  (cov.covered_ranges || []).forEach((r) => {
    const n = el("div", "c"); n.style.left = `${(r.from_sec / d) * 100}%`; n.style.width = `${((r.to_sec - r.from_sec) / d) * 100}%`; w.appendChild(n);
  });
  (cov.uncovered_ranges || []).forEach((g) => {
    const n = el("div", "g"); n.style.left = `${(g.from_sec / d) * 100}%`; n.style.width = `${((g.to_sec - g.from_sec) / d) * 100}%`; w.appendChild(n);
  });
  const h = el("div", "h"); h.id = "covHead"; h.style.left = `${(state.t / d) * 100}%`; w.appendChild(h);
  return w;
}

function vOverview(box) {
  const a = state.audit, tr = state.transcript;
  const defects = (state.findings || []).filter((f) => f.kind === "defect");
  const m = el("div", "metrics");
  const met = (v, l) => { const d = el("div", "metric"); d.append(el("b", "", String(v)), el("span", "", l)); m.appendChild(d); };
  met(a.scenes?.length ?? 0, "scenes"); met(a.entities?.length ?? 0, "entities");
  met((state.findings || []).length, "findings"); met(defects.length, "defects");
  if (tr?.stats) { met(tr.stats.sentences, "sentences"); met(tr.stats.wpm, "wpm"); }
  box.appendChild(m);
  const cov = coverageBar(); if (cov) box.appendChild(cov);

  const two = el("div", "three");
  const left = el("div");
  left.appendChild(el("h3", "sec", "Longest scenes"));
  const t1 = el("table");
  t1.innerHTML = `<thead><tr><th>time</th><th>scene</th><th>dur</th></tr></thead>`;
  const b1 = el("tbody");
  [...(a.scenes || [])].sort((x, y) => (y.end_sec - y.start_sec) - (x.end_sec - x.start_sec)).slice(0, 7).forEach((s) => {
    const tr2 = el("tr", "row");
    tr2.dataset.s = s.start_sec; tr2.dataset.e = s.end_sec;
    tr2.innerHTML = `<td class="t"><span class="tc">${fmt(s.start_sec)}</span></td><td class="clamp"></td><td class="n">${(s.end_sec - s.start_sec).toFixed(0)}s</td>`;
    tr2.children[1].textContent = s.activity || "—";
    tr2.onclick = () => seek(s.start_sec);
    b1.appendChild(tr2);
  });
  t1.appendChild(b1); left.appendChild(t1);

  const right = el("div");
  right.appendChild(el("h3", "sec", `Defects (${defects.length})`));
  const t2 = el("table");
  t2.innerHTML = `<thead><tr><th>time</th><th>finding</th></tr></thead>`;
  const b2 = el("tbody");
  (defects.length ? defects : [{ timestamp: null, text: "No defects flagged in this run." }]).slice(0, 8).forEach((f) => {
    const tr2 = el("tr", "row");
    tr2.innerHTML = `<td class="t">${f.timestamp ? `<span class="tc">${f.timestamp}</span>` : '<span class="dim">—</span>'}</td><td class="clamp"></td>`;
    tr2.children[1].textContent = f.text;
    const t = f.at_sec;
    if (t != null) { tr2.dataset.ft = t; tr2.onclick = () => seek(t); }
    b2.appendChild(tr2);
  });
  t2.appendChild(b2); right.appendChild(t2);

  const third = el("div");
  third.appendChild(el("h3", "sec", `Entities (${a.entities?.length ?? 0})`));
  const t3 = el("table");
  t3.innerHTML = `<thead><tr><th>id</th><th>who / what</th><th>seen</th></tr></thead>`;
  const b3 = el("tbody");
  [...(a.entities || [])].sort((x, y) => (y.appearances?.length || 0) - (x.appearances?.length || 0)).slice(0, 8).forEach((e) => {
    const tr3 = el("tr", "row");
    tr3.dataset.s = e.first_seen_sec; tr3.dataset.e = e.last_seen_sec;
    tr3.innerHTML = `<td class="t mono">${e.id}</td><td class="clamp"></td><td class="n dim">${e.appearances?.length ?? 0}×</td>`;
    tr3.children[1].textContent = e.label ?? e.descriptors?.[0] ?? e.kind;
    tr3.onclick = () => seek(e.first_seen_sec);
    b3.appendChild(tr3);
  });
  t3.appendChild(b3); third.appendChild(t3);

  two.append(left, right, third);
  box.appendChild(two);
}

function vScenes(box) {
  const a = state.audit;
  const rows = [...(a.scenes || [])].sort((x, y) => x.start_sec - y.start_sec)
    .filter((s) => !state.filter || norm(`${s.activity} ${s.setting} ${(s.on_screen_text || []).join(" ")}`).includes(norm(state.filter)));
  if (!rows.length) { box.appendChild(el("div", "empty", "No scenes match.")); return; }
  const t = el("table");
  t.innerHTML = `<thead><tr><th>in</th><th>out</th><th>dur</th><th>scene</th><th>on-screen text</th></tr></thead>`;
  const tb = el("tbody");
  rows.forEach((s) => {
    const tr = el("tr", "row");

function vTranscript(box) {
  const tr = state.transcript;
  if (!tr || tr.mode === "none") { box.appendChild(el("div", "empty", "No transcript captured for this run.")); return; }

  if (tr.mode === "text") {
    box.appendChild(el("div", "toolbar")).appendChild(el("span", "meta", "plain text · timings recovered from inline timecodes only"));
    // Engines sometimes return prose with inline "00:09.0" markers instead of segments.
    const parts = [];
    const src = String(tr.text || "");
    const re = /(\d{1,2}:\d{2}(?::\d{2})?(?:[.,]\d{1,3})?)/g;
    let m, lastIndex = 0, pending = null;
    while ((m = re.exec(src))) {
      const t = parseTC(m[1]);
      const before = src.slice(lastIndex, m.index).trim();
      if (pending == null) {
        if (before) parts.push({ t: null, text: before.replace(/\s+/g, " ") });
      } else {
        const body = before.replace(/\s+/g, " ");
        if (body) parts.push({ t: pending, text: body });
      }
      pending = t;
      lastIndex = m.index + m[1].length;
    }
    const tail = src.slice(lastIndex).trim();
    if (pending != null) parts.push({ t: pending, text: tail.replace(/\s+/g, " ") });
    else if (tail) parts.push({ t: null, text: tail.replace(/\s+/g, " ") });

    const rows = parts.filter((p) => p.text && (!state.filter || norm(p.text).includes(norm(state.filter))));
    if (!rows.length) { box.appendChild(el("div", "empty", "No transcript text.")); return; }
    rows.forEach((p) => {
      const row = el("div", "srow");
      const meta = el("div", "smeta");
      if (p.t != null) meta.append(tcSpan(p.t));
      else meta.append(el("span", "dim", "—"));
      row.append(meta, el("div", "stext", p.text));
      if (p.t != null) { row.dataset.s = p.t; row.dataset.e = p.t + 6; row.onclick = () => seek(p.t); }
      box.appendChild(row);
    });
    return;
  }

  const st = tr.stats;
  const bar = el("div", "toolbar");
  const sel = el("select");
  sel.innerHTML = `<option value="all">All sentences</option><option value="gaps">After a pause > 0.8s</option><option value="estimated">Estimated splits</option>`;
  sel.value = state.txFilter;
  sel.onchange = () => { state.txFilter = sel.value; savePrefs(); render(); };
  const metaBits = [
    st.cues ? `${st.cues} cues` : null,
    `${st.sentences} sentences`,
    `${st.words} words`,
    `${st.wpm} wpm`,
    `speech ${fmt(st.speech)} (${st.coverage}%)`,
    `${st.pauses} pauses`,
    st.estimated ? `${st.estimated} split` : null,
    tr.cueSource ? `cues: ${tr.cueSource}` : null,
  ].filter(Boolean).join(" | ");
  bar.append(sel, el("span", "meta", metaBits));
  box.appendChild(bar);

  const rows = tr.sentences.filter((s) => {
    if (state.txFilter === "gaps" && !(s.gapBefore >= 0.8)) return false;
    if (state.txFilter === "estimated" && !s.estimated) return false;
    return !state.filter || norm(s.text).includes(norm(state.filter));
  });
  if (!rows.length) { box.appendChild(el("div", "empty", "No sentences match.")); return; }

  rows.forEach((s) => {
    const row = el("div", "srow");
    row.dataset.s = s.start; row.dataset.e = s.end;
    const meta = el("div", "smeta");
    meta.append(tcSpan(s.start), el("span", "dim", "→"), tcSpan(s.end));
    meta.append(el("span", "tag", `${s.dur.toFixed(1)}s`), el("span", "tag", `${s.wc}w`));
    if (s.wpm) meta.append(el("span", "tag", `${s.wpm} wpm`));
    if (s.gapBefore >= 0.8) meta.append(el("span", "tag warn", `+${s.gapBefore.toFixed(1)}s`));
    if (s.estimated) meta.append(el("span", "tag", "split"));
    const text = el("div", "stext");
    if (s.wordList?.length) {
      s.wordList.forEach((w) => {
        const sp = el("span", "w", w.word);
        sp.dataset.ws = w.start_sec; sp.dataset.we = w.end_sec;
        text.append(sp, document.createTextNode(" "));
      });
    } else text.textContent = s.text;
    row.append(meta, text);
    row.onclick = () => seek(s.start);
    box.appendChild(row);
  });
}

/* playback */
function seek(t) {
  const target = clamp(t, 0, state.duration || 0);
  const v = $("#video");
  if (v.src && Number.isFinite(v.duration)) { try { v.currentTime = target; } catch { /* not ready */ } }
  paint(target);
}

function paint(t) {
  state.t = t;
  $("#now").textContent = fmt(t, 1);
  const scrub = $("#scrub");
  if (scrub && !state.dragging) {
    const d = state.duration || 1;
    scrub.value = String(Math.round((clamp(t, 0, d) / d) * 10000));
    scrub.setAttribute("aria-valuetext", `${fmt(t, 1)} of ${fmt(state.duration)}`);
  }
  const pps = Number($("#timeline").dataset.pps || 1);
  const ph = $("#ph");
  if (ph) { ph.style.left = `${56 + t * pps}px`; ph.style.height = `${$("#timeline").scrollHeight}px`; }
  const ch = $("#covHead");
  if (ch) ch.style.left = `${(t / (state.duration || 1)) * 100}%`;

  const sc = sceneAt(t);
  $("#nowScene").textContent = sc ? `${sc.activity}${sc.setting ? ` · ${sc.setting}` : ""}` : "";
  const sn = sentenceAt(t);
  const pa = pauseAt(t);
  $("#nowSub").textContent = sn ? `“${sn.text.slice(0, 96)}${sn.text.length > 96 ? "…" : ""}”` : pa && pa.dur >= 0.8 ? `silence ${pa.dur.toFixed(1)}s` : "";

  if (!state.follow) return;
  document.querySelectorAll("#timeline .bar").forEach((b) => {
    b.classList.toggle("on", t >= Number(b.dataset.s) && t < Number(b.dataset.e));
  });
  document.querySelectorAll("#content tr.row").forEach((r) => {
    const s0 = Number(r.dataset.s), e0 = Number(r.dataset.e);
    const ft = r.dataset.ft != null ? Number(r.dataset.ft) : null;
    r.classList.toggle("on", (Number.isFinite(s0) && Number.isFinite(e0) && t >= s0 && t < e0) || (ft != null && Math.abs(ft - t) <= 2));
  });
  document.querySelectorAll("#content .srow").forEach((r) => {
    const on = t >= Number(r.dataset.s) && t < Number(r.dataset.e);
    r.classList.toggle("on", on);
    if (on) {
      r.querySelectorAll(".w").forEach((w) => {
        const ws = Number(w.dataset.ws), we = Number(w.dataset.we);
        w.classList.toggle("cur", Number.isFinite(ws) && t >= ws && t < we);
      });
    }
  });
}

/* wiring */
function wire() {
  $("#filter").addEventListener("input", (e) => { state.filter = e.target.value; render(); });
  $("#videoBtn").onclick = () => { state.video = !state.video; savePrefs(); applyChrome(); renderTimeline(); paint(state.t); };
  const toggleFollow = () => { state.follow = !state.follow; savePrefs(); applyChrome(); paint(state.t); };
  const toggleTheme = () => { state.theme = state.theme === "dark" ? "light" : "dark"; savePrefs(); applyChrome(); };
  const toggleContrast = () => { state.contrast = !state.contrast; savePrefs(); applyChrome(); };
  $("#followBtn").onclick = toggleFollow;
  $("#themeBtn").onclick = toggleTheme;
  $("#contrastBtn").onclick = toggleContrast;
  $("#followMenu").onclick = () => { toggleFollow(); $("#pop").hidden = true; };
  $("#themeMenu").onclick = () => { toggleTheme(); $("#pop").hidden = true; };
  $("#contrastMenu").onclick = () => { toggleContrast(); $("#pop").hidden = true; };
  $("#moreBtn").onclick = (e) => { e.stopPropagation(); $("#pop").hidden = !$("#pop").hidden; };
  document.addEventListener("click", (e) => { const p = $("#pop"); if (!p.hidden && !p.contains(e.target) && e.target.id !== "moreBtn") p.hidden = true; });

  $("#auditFile").onchange = async (e) => {
    const f = e.target.files?.[0]; if (!f) return;
    try { applyPayload(JSON.parse(await f.text())); toast(`audit loaded: ${f.name}`); }
    catch (err) { toast(`not valid JSON: ${err.message}`); }
    e.target.value = "";
  };
  $("#videoFile").onchange = (e) => {
    const f = e.target.files?.[0]; if (!f) return;
    setVideo(URL.createObjectURL(f));
    state.video = true; savePrefs(); applyChrome(); toast(`video loaded: ${f.name}`);
    e.target.value = "";
  };
  $("#pathLoadBtn").onclick = () => loadFromPath($("#pathInput").value);
  $("#pathInput").addEventListener("keydown", (e) => { if (e.key === "Enter") loadFromPath($("#pathInput").value); });
  $("#latestBtn").onclick = () => loadLatestExport();
  $("#exportBtn").onclick = copyTSV;

  $("#playBtn").onclick = () => { const v = $("#video"); v.paused ? v.play() : v.pause(); };
  $("#muteBtn").onclick = () => {
    const v = $("#video"); v.muted = !v.muted;
    $("#muteBtn").textContent = v.muted ? "Unmute" : "Mute";
    $("#muteBtn").setAttribute("aria-pressed", String(v.muted));
  };
  const scrub = $("#scrub");
  scrub.addEventListener("input", () => {
    state.dragging = true;
    const d = state.duration || 0;
    seek((Number(scrub.value) / 10000) * d);
  });
  scrub.addEventListener("change", () => { state.dragging = false; });
  scrub.addEventListener("blur", () => { state.dragging = false; });
  $("#video").addEventListener("play", () => { $("#playBtn").textContent = "Pause"; });
  $("#video").addEventListener("pause", () => { $("#playBtn").textContent = "Play"; });
  $("#video").addEventListener("timeupdate", (e) => paint(e.target.currentTime));
  $("#video").addEventListener("seeked", (e) => paint(e.target.currentTime));
  document.querySelectorAll("[data-seek]").forEach((b) => { b.onclick = () => seek(state.t + Number(b.dataset.seek)); });
  $("#speed").onchange = (e) => { $("#video").playbackRate = Number(e.target.value); };

  $("#zoomIn").onclick = () => { const c = Number($("#timeline").dataset.pps || 1); state.pps = clamp(c * 1.6, 0.5, 40); savePrefs(); renderTimeline(); paint(state.t); };
  $("#zoomOut").onclick = () => { const c = Number($("#timeline").dataset.pps || 1); const n = c / 1.6; state.pps = n * state.duration < 240 ? 0 : clamp(n, 0.5, 40); savePrefs(); renderTimeline(); paint(state.t); };

  document.addEventListener("keydown", (e) => {
    if (["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName)) { if (e.key === "Escape") e.target.blur(); return; }
    const v = $("#video");
    if (e.key === " ") { e.preventDefault(); v.paused ? v.play() : v.pause(); }
    else if (e.key === "ArrowRight") seek(state.t + 2);
    else if (e.key === "ArrowLeft") seek(state.t - 2);
    else if (e.key === "j") seek(state.t - 10);
    else if (e.key === "l") seek(state.t + 10);
    else if (e.key === "n" || e.key === "p") {
      const list = [...(state.audit?.scenes || [])].sort((a, b) => a.start_sec - b.start_sec);
      const i = list.findIndex((s) => s.start_sec > state.t + 0.05);
      const target = e.key === "n" ? list[Math.max(i, 0)] : list[Math.max((i === -1 ? list.length : i) - 2, 0)];
      if (target) seek(target.start_sec);
    } else if (e.key === "," || e.key === ".") {
      const sents = state.transcript?.sentences || [];
      const i = sents.findIndex((s) => s.start > state.t + 0.05);
      const target = e.key === "." ? sents[Math.max(i, 0)] : sents[Math.max((i === -1 ? sents.length : i) - 2, 0)];
      if (target) { if (state.view !== "transcript") { state.view = "transcript"; renderTabs(); render(); } seek(target.start); }
    } else if (e.key === "/") { e.preventDefault(); $("#filter").focus(); }
    else if (e.key === "m") { $("#muteBtn").click(); }
    else if (e.key === "f") { state.video = !state.video; savePrefs(); applyChrome(); renderTimeline(); }
  });

  window.addEventListener("resize", () => { renderTimeline(); paint(state.t); });
  document.addEventListener("dragover", (e) => e.preventDefault());
  document.addEventListener("drop", (e) => {
    e.preventDefault();
    const f = e.dataTransfer?.files?.[0]; if (!f) return;
    if (f.name.endsWith(".json")) f.text().then((x) => applyPayload(JSON.parse(x)));
    else if (f.type.startsWith("video/")) { setVideo(URL.createObjectURL(f)); state.video = true; savePrefs(); applyChrome(); }
  });
}

function pick(accept, cb) {
  const i = $("#filePicker"); i.value = ""; i.accept = accept;
  i.onchange = () => { const f = i.files?.[0]; if (f) cb(f); };
  i.click();

/** Turn a Windows path or repo-relative path into a URL the local server can serve. */
function servedURL(p) {
  let s = String(p || "").trim().replace(/\\/g, "/");
  if (!s) return null;
  if (/^https?:\/\//i.test(s)) return s;
  const marker = "opencode-projects/";
  const i = s.toLowerCase().lastIndexOf(marker);
  if (i >= 0) s = s.slice(i + marker.length);
  else s = s.replace(/^[A-Za-z]:\//, "").replace(/^\/+/, "");
  const parts = s.split("/").filter(Boolean).map((x) => encodeURIComponent(x));
  return parts.length ? `/${parts.join("/")}` : null;
}

async function loadFromPath(p) {
  const url = servedURL(p);
  if (!url) { toast("enter a path first"); return; }
  if (/\.(mp4|mov|webm|m4v)$/i.test(url)) {
    setVideo(url); state.video = true; savePrefs(); applyChrome();
    toast(`video: ${decodeURIComponent(url.split("/").pop())}`);
    $("#pop").hidden = true;
    return;
  }
  if (/\.jsonl$/i.test(url)) {
    try {
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      mergeSidecar(parseJsonl(await res.text()), decodeURIComponent(url.split("/").pop()));
      $("#pop").hidden = true;
    } catch (e) { toast(`sidecar failed: ${e.message}`); }
    return;
  }
  try {
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    applyPayload(await res.json());
    toast(`audit: ${decodeURIComponent(url.split("/").pop())}`);
    $("#pop").hidden = true;
  } catch (e) {
    toast(`load failed: ${e.message}`);
  }
}

/* ---------- sidecars (schema 1.5): *.timeline.jsonl / *.transcript.jsonl ---------- */
function parseJsonl(text) {
  const rows = [];
  for (const rawLine of String(text).split(/\r?\n/)) {
    const line = rawLine.trim();
    if (!line) continue;
    let v;
    try { v = JSON.parse(line); } catch { continue; }
    if (typeof v === "string") { try { v = JSON.parse(v); } catch { continue; } }
    if (v && typeof v === "object") rows.push(v);
  }
  return rows;
}

function mergeSidecar(rows, name) {
  if (!state.audit) { toast("load the audit first, then its sidecars"); return; }
  const a = state.audit;
  const scenes = rows.filter((r) => r.type === "scene");
  const finds = rows.filter((r) => r.type === "finding");
  const cues = rows.filter((r) => r.type === "cue");
  let added = 0;

  if (scenes.length) {
    a.scenes = a.scenes || [];
    const seen = new Set(a.scenes.map((s) => `${s.start_sec}|${s.end_sec}|${s.activity}`));
    for (const s of scenes) {
      const key = `${s.start_sec}|${s.end_sec}|${s.activity}`;
      if (seen.has(key)) continue;
      a.scenes.push({ ...s, chunk_index: s.chunk_index ?? s.chunk ?? 1 });
      seen.add(key);
      added++;
    }
  }

  if (finds.length) {
    a.overall = a.overall || {};
    a.overall.findings = a.overall.findings || [];
    const seen = new Set(a.overall.findings.map((f) => `${f.at_sec}|${f.text}`));
    for (const f of finds) {
      const key = `${f.at_sec}|${f.text}`;
      if (seen.has(key)) continue;
      a.overall.findings.push({ ...f });
      seen.add(key);
      added++;
    }
  }

  if (cues.length) {
    a.segments = a.segments || [];
    const byChunk = new Map();
    for (const c of cues) {
      const k = c.chunk ?? c.chunk_index ?? 1;
      if (!byChunk.has(k)) byChunk.set(k, []);
      byChunk.get(k).push(c);
    }
    for (const [chunk, list] of byChunk) {
      let seg = a.segments.find((s) => s.chunk_index === chunk);
      if (!seg) {
        seg = {
          chunk_index: chunk, time_range: "",
          start_sec: Math.min(...list.map((c) => c.start_sec)),
          end_sec: Math.max(...list.map((c) => c.end_sec)),
          offset_sec: 0, status: "completed",
          findings: [], scenes: [], entities_seen: [],
          transcript: null, analysis: null, error: null,
        };
        a.segments.push(seg);
      }
      seg.transcript = seg.transcript || {
        text: "", chars: 0, engine: "sidecar", model: name,
        cues: [], cue_count: 0, word_count: 0, cue_source: "provider", timed: true,
      };
      seg.transcript.cues = list.map((c) => ({
        start_sec: c.start_sec, end_sec: c.end_sec, text: c.text,
        speaker: c.speaker ?? null, words: c.words ?? null,
      }));
      seg.transcript.cue_count = seg.transcript.cues.length;
      seg.transcript.cue_source = "provider";
      added += seg.transcript.cues.length;
    }
  }

  state.transcript = buildTranscript(a);
  state.findings = normalizeFindings(a);
  renderTabs();
  render();
  toast(`sidecar ${name}: +${added} rows`);
}

/** Pick the newest audit-like file (audits/ first) and pull its sidecars along. */
async function loadLatestExport() {
  const dirs = ["audits", "audit-output"];
  for (const dir of dirs) {
    let files;
    try {
      const res = await fetch(`/_list?dir=${encodeURIComponent(dir)}`, { cache: "no-store" });
      if (!res.ok) continue;
      files = await res.json();
    } catch { continue; }

    const hit = files.find((f) => /\.(audit|explorer)\.json$/i.test(f.name) || /-job\.json$/i.test(f.name));
    if (!hit) continue;

    await loadFromPath(`${dir}/${hit.name}`);
    // Sidecars share the stem: <name>.audit.json -> <name>.transcript.jsonl
    const stem = hit.name.replace(/\.(audit|explorer)\.json$/i, "");
    for (const kind of ["transcript", "timeline"]) {
      const side = files.find((f) => f.name === `${stem}.${kind}.jsonl`);
      if (!side) continue;
      const sideURL = servedURL(`${dir}/${side.name}`);
      if (!sideURL) continue;
      try {
        const r = await fetch(sideURL, { cache: "no-store" });
        if (r.ok) mergeSidecar(parseJsonl(await r.text()), side.name);
      } catch { /* sidecars are optional */ }
    }
    return;
  }
  toast("no audit files found");
}

async function copyTSV() {  const a = state.audit; if (!a) return;
  const rows = [["start", "end", "dur_s", "activity", "setting", "on_screen_text"]];
  [...(a.scenes || [])].sort((x, y) => x.start_sec - y.start_sec).forEach((s) => rows.push([
    fmt(s.start_sec), fmt(s.end_sec), (s.end_sec - s.start_sec).toFixed(1), s.activity ?? "", s.setting ?? "", (s.on_screen_text || []).join(" | "),
  ]));
  const tsv = rows.map((r) => r.map((c) => String(c).replace(/\t/g, " ")).join("\t")).join("\n");
  try { await navigator.clipboard.writeText(tsv); toast("scenes copied as TSV"); } catch { toast("clipboard blocked"); }
}

boot();
</script>
